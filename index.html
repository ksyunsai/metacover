<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#183447">
  <meta name="description" content="수원·용인·오산 8개 지역의 지방하천 50년 빈도 범람예상도와 예상 침수 깊이를 한 화면에서 봅니다.">
  <title>침수이력 및 범람예상도 | 메타커버</title>
  <style>
    :root { color-scheme: light; color: #253c4c; background: #fff; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    * { box-sizing: border-box; }
    body,figure { margin: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    .map-window { width: 100%; overflow: auto; overscroll-behavior: contain; background: #fff; }
    .map-crop { width: 100%; aspect-ratio: 1612 / 775; overflow: hidden; }
    .map-image { display: block; width: 100%; height: auto; }
    .map-window.enlarged { max-height: calc(100vh - 43px); max-height: calc(100dvh - 43px); }
    .enlarged .map-crop { width: max(1612px, 165vw); }
    .caption { display: flex; align-items: center; gap: 14px; padding: 3px 12px; min-height: 37px; border-top: 1px solid #d6dfe3; color: #526671; background: #f5f7f7; font-size: 12px; }
    .caption span { margin-right: auto; }
    .caption a,.caption button { display: inline-flex; align-items: center; min-height: 30px; padding: 3px 0; color: #1b4c64; font: inherit; line-height: 1.4; cursor: pointer; }
    .caption a { text-underline-offset: 3px; }
    .caption button { border: 0; background: transparent; }
    :focus-visible { outline: 2px solid #1c7182; outline-offset: 2px; }
    .map-window:focus-visible { outline-offset: -2px; }
    .error { margin: 0; padding: 24px 12px; line-height: 1.6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">메타커버 침수이력 및 범람예상도</h1>
    <figure>
      <div id="map-window" class="map-window" role="region" aria-label="메타커버 지도 시연 화면">
        <div id="map-crop" class="map-crop">
          <img id="map-image" class="map-image" width="1612" height="790" src="https://metacover-flood-atlas-kr.ksyunsai.chatgpt.site/screen.png" fetchpriority="high" draggable="false" alt="수원시 4개 구, 용인시 3개 구와 오산시의 지방하천 50년 빈도 범람예상도. 분홍색은 범람 위치를 강조하고 파란색과 보라색 5단계는 예상 침수 깊이 0.5m 미만부터 5m 이상까지를 나타냅니다.">
        </div>
        <p id="map-error" class="error" role="status" hidden>지도 이미지를 불러오지 못했습니다. 아래의 ‘지역별 공식 지도’를 열어 주세요.</p>
      </div>
      <figcaption class="caption">
        <span>시연 화면</span>
        <button type="button" id="zoom" aria-controls="map-window" aria-pressed="false" hidden>크게 보기</button>
        <a href="./live/">지역별 공식 지도</a>
      </figcaption>
    </figure>
  </main>
  <script>
    const viewport = document.getElementById("map-window");
    const crop = document.getElementById("map-crop");
    const mapImage = document.getElementById("map-image");
    const zoom = document.getElementById("zoom");
    const errorMessage = document.getElementById("map-error");
    function showImageStatus() {
      const loaded = mapImage.naturalWidth > 0;
      crop.hidden = !loaded;
      zoom.hidden = !loaded;
      errorMessage.hidden = loaded;
    }
    mapImage.addEventListener("load", showImageStatus);
    mapImage.addEventListener("error", showImageStatus);
    if (mapImage.complete) showImageStatus();
    zoom.addEventListener("click", () => {
      const enlarged = viewport.classList.toggle("enlarged");
      zoom.setAttribute("aria-pressed", String(enlarged));
      zoom.textContent = enlarged ? "전체 보기" : "크게 보기";
      if (enlarged) {
        viewport.tabIndex = 0;
        viewport.scrollLeft = (viewport.scrollWidth - viewport.clientWidth) / 2;
        viewport.scrollTop = (viewport.scrollHeight - viewport.clientHeight) / 2;
        viewport.focus({ preventScroll: true });
      } else {
        viewport.removeAttribute("tabindex");
        viewport.scrollTo(0, 0);
      }
    });
  </script>
</body>
</html>
